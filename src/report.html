<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare - Отчеты</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/report.css">
</head>
<body data-page="report">
    <header class="header">
        <img src="icons/logo.png" alt="PetCare" class="logo">
        <nav class="nav">
            <button class="nav-btn" data-page="main">Главная</button>
            <button class="nav-btn" data-page="pets">Мои питомцы</button>
            <button class="nav-btn" data-page="vacs">Вакцинации</button>
            <button class="nav-btn" data-page="report">Отчеты</button>
        </nav>
        <div class="header-right">
            <input class="search-input" type="text" placeholder="Поиск">
            <button class="avatar-btn" data-page="profile" title="Профиль">
                <img id="reportHeaderAvatar" src="" alt="Профиль">
            </button>
        </div>
    </header>

    <main class="page">
        <section class="card">
            <h1>Отчеты</h1>
            <p>Сводка по питомцам и вакцинациям.</p>
            <div id="reportContainer" class="report-grid"></div>
            <button id="downloadReportBtn" class="download-btn" type="button">Скачать отчет</button>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <p>© 2026 PetCare. All rights reserved.</p>
        </div>
        <div class="footer-center">
            <img src="icons/logo.png" alt="PetCare">
            <p><span class="brand-pet">Pet</span><span class="brand-care">Care</span> - Система учета домашних животных.</p>
        </div>
        <div class="footer-right">
            <p>Наши контакты:</p>
            <p>petcare@gmail.com</p>
            <p>animalcare@gmail.com</p>
        </div>
    </footer>

    <script src="js/app-utils.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
