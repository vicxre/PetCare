<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare - Мои питомцы</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pets.css">
</head>
<body data-page="pets">
    <header class="header">
        <img src="icons/logo.png" alt="PetCare" class="logo">
        <nav class="nav">
            <button class="nav-btn" data-page="main">Главная</button>
            <button class="nav-btn" data-page="pets">Мои питомцы</button>
            <button class="nav-btn" data-page="vacs">Вакцинации</button>
            <button class="nav-btn" data-page="report">Отчеты</button>
        </nav>
        <div class="header-right">
            <input class="search-input" type="text" placeholder="Поиск">
            <button class="avatar-btn" data-page="profile" title="Профиль">
                <img id="petsHeaderAvatar" src="" alt="Профиль">
            </button>
        </div>
    </header>

    <main class="page page-wrap">
        <section class="card pets-card">
            <div class="pets-head">
                <div>
                    <h1>Список питомцев</h1>
                    <p>Редактируйте или удаляйте питомцев. Все изменения сохраняются в базе данных.</p>
                </div>
                <div class="pets-tools">
                    <button id="addPetBtn" class="plus-btn" type="button" title="Добавить питомца">+</button>
                    <input id="petsSearchInput" type="text" class="pets-search" placeholder="Поиск по ключевым словам">
                    <select id="petsSortSelect" class="pets-sort">
                        <option value="newest">Сначала новые</option>
                        <option value="oldest">Сначала старые</option>
                        <option value="name-asc">Имя А-Я</option>
                        <option value="name-desc">Имя Я-А</option>
                        <option value="weight-asc">Вес по возрастанию</option>
                        <option value="weight-desc">Вес по убыванию</option>
                    </select>
                </div>
            </div>
            <div id="petsContainer" class="pets-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <p>© 2026 PetCare. All rights reserved.</p>
        </div>
        <div class="footer-center">
            <img src="icons/logo.png" alt="PetCare">
            <p><span class="brand-pet">Pet</span><span class="brand-care">Care</span> - Система учета домашних животных.</p>
        </div>
        <div class="footer-right">
            <p>Наши контакты:</p>
            <p>petcare@gmail.com</p>
            <p>animalcare@gmail.com</p>
        </div>
    </footer>

    <div id="editPetModal" class="modal hidden">
        <div class="modal-card">
            <button id="closeEditModalBtn" class="close-btn" type="button" title="Закрыть">x</button>
            <h3>Редактирование питомца</h3>
            <form id="editPetForm">
                <input id="editPetId" type="hidden">
                <label>Имя
                    <input id="editPetName" type="text" required>
                </label>
                <label>Дата рождения
                    <input id="editPetBirthDate" type="date">
                </label>
                <label>Порода
                    <input id="editPetBreed" type="text" required>
                </label>
                <label>Вес (кг)
                    <input id="editPetWeight" type="number" step="0.1" min="0">
                </label>
                <label>Окрас
                    <input id="editPetColor" type="text">
                </label>
                <label>Заметки
                    <input id="editPetNotes" type="text" maxlength="250">
                </label>
                <button class="save-btn" type="submit">Сохранить изменения</button>
            </form>
        </div>
    </div>

    <div id="addPetModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeAddModalBtn" class="close-modal" type="button" title="Закрыть">x</button>
            <h3>Добавление нового питомца</h3>
            <form id="addPetForm">
                <div class="modal-fields">
                    <label>Имя
                        <input id="petName" type="text" required>
                    </label>
                    <label>Дата рождения
                        <input id="petBirthDate" type="date">
                    </label>
                    <label>Порода
                        <input id="petBreed" type="text" required>
                    </label>
                    <label>Вес (кг)
                        <input id="petWeight" type="number" step="0.1" min="0">
                    </label>
                    <label>Окрас
                        <input id="petColor" type="text">
                    </label>
                    <label>Заметки
                        <input id="petNotes" type="text" maxlength="250">
                    </label>
                </div>

                <div class="upload-row">
                    <input id="petPhoto" type="file" accept=".png,.jpg,.jpeg" hidden>
                    <button id="uploadPhotoBtn" type="button" class="upload-btn">Загрузить фото (png,jpg)</button>
                    <span id="photoName" class="photo-name">Файл не выбран</span>
                </div>

                <button class="submit-btn" type="submit">Добавить</button>
            </form>
        </div>
    </div>

    <script src="js/app-utils.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/pets.js"></script>
</body>
</html>
